apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4.1-flash-1017-w8a8
id: vllm-tp8-dp2-ascend-910b4-1-baseline
version: 1.0.0
servedName: deepseek-v41
description: 'Baseline: TP8 DP2 on 0 ASCEND-910B4-1 GPUs, single node, ascend weights.'
engine: vllm
chart:
  name: vllm
  version: '>=0.8.23'
image:
  repository: quay.io/ascend/vllm-ascend
  tag: pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
  digest: sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
requires:
  gpus: 0
  nodes: 2
  topology: lws
values:
  env:
  - name: SERVED_MODEL_NAME
    value: deepseek-v41
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: NIC_NAME
    value: bond1
  - name: VLLM_USE_V2_MODEL_RUNNER
    value: '0'
  - name: VLLM_ENGINE_READY_TIMEOUT_S
    value: '3600'
  - name: PYTORCH_NPU_ALLOC_CONF
    value: expandable_segments:True
  - name: ASCEND_RT_VISIBLE_DEVICES
    value: 0,1,2,3,4,5,6,7
  - name: ASCEND_GLOBAL_LOG_LEVEL
    value: '1'
  - name: ASCEND_PROCESS_LOG_PATH
    value: /root/ascend/log
  lws:
    size: 2
    enabled: true
    distPort: 13399
    replicas: 1
    restartPolicy: RecreateGroupOnPodRestart
    startupPolicy: LeaderCreated
    waitForLeader: true
    rolloutStrategy:
      type: RollingUpdate
      rollingUpdateConfiguration:
        maxSurge: 0
        maxUnavailable: 1
    workerTerminationGracePeriodSeconds: 60
  cart:
    enabled: false
  model:
    mountPath: /models
    hostPathType: Directory
    contextLength: '1048576'
  scaler:
    enabled: false
  service:
    port: 18000
  volumes:
  - name: cann-diagnostics
    hostPath:
      path: /data/share/deployments/deepseek-v41-1017-cann
      type: DirectoryOrCreate
  dnsPolicy: ClusterFirstWithHostNet
  resources:
    limits:
      cpu: '32'
      memory: 768Gi
      volcano.sh/Ascend910B4-1: '8'
    requests:
      cpu: '32'
      memory: 768Gi
      volcano.sh/Ascend910B4-1: '8'
  modelCheck:
    enabled: false
  hangWatcher:
    enabled: false
  hostNetwork: true
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 360
    initialDelaySeconds: 60
  volumeMounts:
  - name: cann-diagnostics
    mountPath: /root/ascend/log
  schedulerName: volcano
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  commandOverride:
  - bash
  - -c
  - "set -euo pipefail\nRANK=\"${LWS_WORKER_INDEX:-0}\"\ncase \"$RANK\" in 0|1) ;;\
    \ *) echo \"Invalid node rank: $RANK\" >&2; exit 1 ;; esac\nexport HCCL_IF_IP=\"\
    ${POD_IP:?}\"\nexport GLOO_SOCKET_IFNAME=\"${NIC_NAME:?}\" TP_SOCKET_IFNAME=\"\
    $NIC_NAME\" HCCL_SOCKET_IFNAME=\"$NIC_NAME\"\nif [ -f /usr/lib/aarch64-linux-gnu/libjemalloc.so.2\
    \ ]; then\n  export LD_PRELOAD=\"/usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}\"\
    \nfi\nLEADER_IP=''\nfor _ in $(seq 1 60); do\n  if LEADER_IP=$(python3 -c 'import\
    \ socket,sys; print(socket.gethostbyname(sys.argv[1]))' \\\n                 \
    \  \"${LWS_LEADER_ADDRESS:?}\"); then break; fi\n  sleep 5\ndone\n[ -n \"$LEADER_IP\"\
    \ ] || { echo \"Timed out resolving leader address\" >&2; exit 1; }\nset -- /models\
    \ \\\n  --host 0.0.0.0 --port 18000 \\\n  --served-model-name \"${SERVED_MODEL_NAME}\"\
    \ \\\n  --data-parallel-rpc-port 13399 \\\n  --data-parallel-size 2 \\\n  --data-parallel-size-local\
    \ 1 \\\n  --tensor-parallel-size 8 \\\n  --enable-expert-parallel \\\n  --max-model-len\
    \ 1048576 \\\n  --max-num-batched-tokens 4096 \\\n  --max-num-seqs 32 \\\n  --gpu-memory-utilization\
    \ 0.90 \\\n  --block-size 128 \\\n  --tokenizer-mode deepseek_v41 \\\n  --reasoning-parser\
    \ deepseek_v41 \\\n  --tool-call-parser deepseek_v41 \\\n  --enable-auto-tool-choice\
    \ \\\n  --trust-remote-code \\\n  --enable-prompt-tokens-details \\\n  --model-loader-extra-config\
    \ '{\"enable_multithread_load\":true,\"num_threads\":128}' \\\n  --safetensors-load-strategy\
    \ lazy \\\n  --quantization ascend \\\n  --engram-config '{\"cpu_offload\":true,\"\
    dp_shared_memory\":true}' \\\n  --additional-config '{\"enable_cpu_binding\":true,\"\
    ascend_compilation_config\":{\"enable_npugraph_ex\":false,\"enable_static_kernel\"\
    :false}}' \\\n  --speculative-config '{\"method\":\"dspark\",\"num_speculative_tokens\"\
    :5,\"enforce_eager\":true}' \\\n  --compilation-config '{\"cudagraph_mode\":\"\
    FULL_DECODE_ONLY\"}'\n# Rank 1 owns DP ranks 1.. and runs headless: no HTTP server,\
    \ so nothing probes it.\nif [ \"$RANK\" = 1 ]; then\n  set -- \"$@\" --headless\
    \ --data-parallel-start-rank 1\nfi\nexec vllm serve \"$@\" --data-parallel-address\
    \ \"$LEADER_IP\"\n"
  securityContext:
    privileged: true
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 1200
