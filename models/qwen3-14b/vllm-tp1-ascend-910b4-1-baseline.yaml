# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3-14b
id: vllm-tp1-ascend-910b4-1-baseline
version: 1.1.0
description: "Baseline: TP1 on one ASCEND-910B4-1 card, single node."
engine: vllm
chart:
  name: vllm
  version: ">=0.9.1"
image:
  repository: quay.io/ascend/vllm-ascend
  tag: pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
requires:
  gpus: 1
  topology: single-node
  vendor: ascend
  gpuProduct:
    - Ascend-910B4
values:
  model:
    hostPathType: Directory
    contextLength: ""
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  extraArgs:
    - --enable-prompt-tokens-details
    - --tensor-parallel-size=1
  resources:
    limits:
      cpu: "16"
      memory: 64Gi
      ephemeral-storage: 16Gi
    requests:
      cpu: "8"
      memory: 32Gi
      ephemeral-storage: 16Gi
  modelCheck:
    enabled: false
    requiredGlobs:
      - config.json
      - "*.safetensors"
  hangWatcher:
    enabled: false
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  schedulerName: volcano
  progressDeadlineSeconds: 7200
