# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash
id: sglang-tp8-6000d
version: 1.0.3
servedName: deepseek-v4-flash
engine: sglang
description: >-
  TP8 on one eight-GPU node, default MoE runner. Measured max_total_num_tokens 6,524,672.
chart:
  name: sglang
  version: ">=0.7.0"
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
    - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash
    mountPath: /model
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    # This engine fetches client-supplied http(s) media URLs server-side, and
    # with no allowlist any domain is allowed. On a hostNetwork pod that turns
    # an image_url into a request originating from the node, against node-local
    # and cluster-internal addresses. An allowlist matching no real host
    # refuses them all. Redirect targets are checked against the same list.
    - --allowed-media-domains=none.invalid
    - --tp-size=8
    - --mem-fraction-static=0.85
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
  service:
    port: 8050
  hangWatcher:
    enabled: true
