apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash
id: sglang-1p1d-h100
version: 1.0.0
servedName: deepseek-v4-flash
description: "DeepSeek-V4-Flash with prefill/decode disaggregation: 1 prefill + 1 decode pod (TP8 each) on H100, Mooncake transfer backend, cache-aware router."
engine: sglang
chart:
  name: sglang
  version: ">=0.9.2"
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 8
  topology: pd
  rdma: true
  gpuProduct:
    - NVIDIA-H100-80GB-HBM3
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=8
    - --mem-fraction-static=0.85
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
    - --dist-timeout=1800
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: NCCL_DEBUG
      value: WARN
  pd:
    enabled: true
    colocate: false
    transferBackend: mooncake
    prefill:
      size: 1
      gpus: "8"
      httpPort: 30001
      bootstrapPort: 8998
      extraArgs:
        - --chunked-prefill-size=16384
        - --max-prefill-tokens=16384
        - --max-running-requests=64
    decode:
      size: 1
      gpus: "8"
      httpPort: 30002
      bootstrapPort: 8999
      extraArgs:
        - --cuda-graph-max-bs-decode=32
        - --max-running-requests=64
  rdma:
    enabled: true
  scaler:
    enabled: false
  shm:
    sizeLimit: 32Gi
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
