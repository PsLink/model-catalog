apiVersion: catalog.swiss/v2
kind: Variant
model: glm5.3
id: vllm-tp8-pp2-pd-6000d
version: 1.0.1
servedName: glm-5.3
description: Prefill/decode-disaggregated DisaggregatedSet, TP8 PP2 per role on RTX 6000D, mooncake transfer backend. Default 2 prefill + 1 decode; prefill.replicas is configurable at deploy time (xPyD).
engine: vllm
chart:
  name: vllm
  version: ">=0.8.12"
image:
  repository: 4pdosc/vllm-openai
  tag: v0.30.0-pd-fix1
requires:
  # Not the per-pod GPU count: total GPUs here are a deploy-time choice
  # (xPyD — prefill.replicas / decode.replicas are free), so there is no
  # one number to put here. Per-role per-pod GPUs live in
  # values.pd.{prefill,decode}.gpus ("8" for TP8 PP2).
  gpus: 1
  topology: pd
  rdma: true
  gpuProduct:
    - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/GLM-5.3-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    # Same server-side media fetch as the non-PD variants of this model, which
    # already pin this; the PD pair was missed.
    - --allowed-media-domains=none.invalid
    - --pipeline-parallel-size=2
    - --tensor-parallel-size=8
    - --gpu-memory-utilization=0.80
    - --max-model-len=1048576
    - --max-num-seqs=20
    - --trust-remote-code
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
    - --chat-template-content-format=string
    - --tool-call-parser=glm47
    - --enable-auto-tool-choice
    - --reasoning-parser=glm45
    - --max-num-batched-tokens=16384
  env:
    - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
      value: "0"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:False
    # See vllm-tp8-pp2-6000d: sm120 skips these trtllm fused-MoE shapes.
    - name: VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS
      value: trtllm::fused_moe::gemm1,trtllm::fused_moe::gemm2,fp8_gemm
  hostNetwork: true
  rdma:
    enabled: true
  shm:
    enabled: true
    # No mooncake store connector here; 32 Gi covers vLLM shm IPC.
    # Sized for one engine pod per node with values.pd.*.gpus = "8".
    sizeLimit: 32Gi
  scaler:
    enabled: false
  pd:
    enabled: true
    colocate: false
    transferBackend: mooncake
    prefill:
      replicas: 2
      size: 2
      gpus: "8"
    decode:
      replicas: 1
      size: 2
      gpus: "8"
