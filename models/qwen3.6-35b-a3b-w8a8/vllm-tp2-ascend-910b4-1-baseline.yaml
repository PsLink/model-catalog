        --served-model-name qwen3.6-35b-a3b \
        --data-parallel-size 1 --tensor-parallel-size 2 \
        --enable-expert-parallel --quantization ascend \
        --max-num-seqs 128 --max-model-len 135168 --max-num-batched-tokens 4096 \
        --trust-remote-code --safetensors-load-strategy lazy \
        --gpu-memory-utilization 0.90 --dtype bfloat16 --enable-prefix-caching \
        --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE"}' \
        --additional-config '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
  securityContext:
    privileged: true
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 1200
