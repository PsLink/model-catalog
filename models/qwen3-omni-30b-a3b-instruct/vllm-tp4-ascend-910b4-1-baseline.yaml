# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3-omni-30b-a3b-instruct
id: vllm-tp4-ascend-910b4-1-baseline
version: 1.1.0
description: "Baseline: TP4 on four ASCEND-910B4-1 cards, single node."
engine: vllm
chart:
  name: vllm
  version: ">=0.9.1"
image:
  repository: quay.io/ascend/vllm-ascend
  tag: pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
requires:
  gpus: 4
  topology: single-node
  vendor: ascend
  gpuProduct:
    - Ascend-910B4
values:
  env:
    - name: HCCL_BUFFSIZE
      value: "1024"
    - name: OMP_PROC_BIND
      value: "false"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: PYTORCH_NPU_ALLOC_CONF
      value: expandable_segments:True
  model:
    mountPath: /models
    hostPathType: Directory
    contextLength: "65536"
  dnsPolicy: ClusterFirstWithHostNet
  extraArgs:
    - --trust-remote-code
    - --max-num-seqs=100
    - --max-model-len=65536
    - --max-num-batched-tokens=16384
    - --tensor-parallel-size=4
    - --enable-expert-parallel
    - --distributed-executor-backend=mp
    - --no-enable-prefix-caching
    - --async-scheduling
    - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY"}
    - --additional-config={"enable_flashcomm1":true,"weight_nz_mode":2}
    - --gpu-memory-utilization=0.95
  lifecycle:
    shutdownTimeout: 0
  resources:
    limits:
      cpu: "16"
      memory: 128Gi
    requests:
      cpu: "16"
      memory: 128Gi
  modelCheck:
    enabled: false
  hangWatcher:
    enabled: false
  hostNetwork: true
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 360
    initialDelaySeconds: 60
  schedulerName: volcano
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  securityContext:
    privileged: true
  promptTokensDetails: false
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 1200
