# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3-30b-a3b-w8a8
id: vllm-tp4-ascend-910b4-1-baseline
version: 1.0.0
servedName: qwen3-30b-a3b
description: 'Baseline: TP4 on four ASCEND-910B4-1 cards, single node, ascend weights.'
engine: vllm
chart:
  name: vllm
  version: '>=0.8.23'
image:
  repository: quay.io/ascend/vllm-ascend
  tag: pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
requires:
  gpus: 0
  topology: single-node
values:
  env:
    - name: HCCL_BUFFSIZE
      value: '1024'
    - name: OMP_PROC_BIND
      value: 'false'
    - name: OMP_NUM_THREADS
      value: '1'
    - name: PYTORCH_NPU_ALLOC_CONF
      value: expandable_segments:True
  cart:
    enabled: false
  model:
    mountPath: /models
    hostPathType: Directory
    contextLength: '40960'
  scaler:
    enabled: false
  dnsPolicy: ClusterFirstWithHostNet
  resources:
    limits:
      cpu: '16'
      memory: 128Gi
      volcano.sh/Ascend910B4-1: '4'
    requests:
      cpu: '16'
      memory: 128Gi
      volcano.sh/Ascend910B4-1: '4'
  modelCheck:
    enabled: false
  hangWatcher:
    enabled: false
  hostNetwork: true
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 360
    initialDelaySeconds: 60
  schedulerName: volcano
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  commandOverride:
    - bash
    - -c
    - |
      exec vllm serve /models \
        --host 0.0.0.0 --port 8000 \
        --served-model-name qwen3-30b-a3b \
        --trust-remote-code \
        --max-num-seqs 100 --max-model-len 40960 --max-num-batched-tokens 16384 \
        --tensor-parallel-size 4 --enable-expert-parallel --quantization ascend \
        --distributed-executor-backend mp --no-enable-prefix-caching --async-scheduling \
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
        --additional-config '{"enable_flashcomm1":true,"weight_nz_mode":2}' \
        --gpu-memory-utilization 0.95
  securityContext:
    privileged: true
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 1200
