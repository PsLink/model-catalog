# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3.6-27b-w8a8
id: vllm-tp2-ascend-910b4-1-baseline
version: 1.0.0
servedName: qwen3.6-27b
description: 'Baseline: TP2 on two ASCEND-910B4-1 cards, single node, ascend weights.'
engine: vllm
chart:
  name: vllm
  version: '>=0.8.23'
image:
  repository: quay.io/ascend/vllm-ascend
  tag: pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33
requires:
  gpus: 0
  topology: single-node
values:
  env:
    - name: PYTORCH_NPU_ALLOC_CONF
      value: expandable_segments:True
    - name: HCCL_BUFFSIZE
      value: '512'
  model:
    mountPath: /models
    hostPathType: Directory
    contextLength: '133120'
  dnsPolicy: ClusterFirstWithHostNet
  extraArgs:
    - --data-parallel-size=1
    - --tensor-parallel-size=2
    - --quantization=ascend
    - --max-num-seqs=32
    - --max-model-len=133120
    - --max-num-batched-tokens=16384
    - --trust-remote-code
    - --allowed-local-media-path=/
    - --dtype=bfloat16
    - --reasoning-parser=qwen3
    - --mm-processor-cache-gb=0
    - --mm-encoder-tp-mode=data
    - --mm-processor-cache-type=shm
    - --gpu-memory-utilization=0.85
    - --speculative-config={"method":"qwen3_5_mtp","num_speculative_tokens":3}
    - --compilation-config={"cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode":"FULL_DECODE_ONLY"}
    - --additional-config={"enable_cpu_binding":true}
  lifecycle:
    shutdownTimeout: 0
  resources:
    limits:
      cpu: '16'
      memory: 128Gi
      volcano.sh/Ascend910B4-1: '2'
    requests:
      cpu: '16'
      memory: 128Gi
      volcano.sh/Ascend910B4-1: '2'
  modelCheck:
    enabled: false
  hangWatcher:
    enabled: false
  hostNetwork: true
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 360
    initialDelaySeconds: 60
  schedulerName: volcano
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  securityContext:
    privileged: true
  promptTokensDetails: false
  progressDeadlineSeconds: 7200
  terminationGracePeriodSeconds: 1200
