apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash-0731-nvfp4
id: sglang-tp8-pd-l3-6000d
version: 1.0.2
servedName: deepseek-v4-flash-0731-nvfp4
engine: sglang
description: >-
  Prefill/decode-disaggregated, TP8 on one RTX 6000D node per engine, with
  HiCache on the prefill role: L2 in hugepages (ratio 2) and Mooncake NVMe-oF
  as L3 on a shared EBOF array via a standalone master. Default 2 prefill + 1
  decode; prefill.replicas is configurable at deploy time (xPyD). Prefill pods
  need the storage network, decode pods do not. A prefix survives a prefill
  restart: it comes back from L3.
# Verified 2026-11-03 with chart 0.9.28, deployed through swiss as 2P1D and
# 1P1D, and earlier as a plain helm release: twice, a 3.9k-token prefix came
# back from L3 to a recreated prefill pod (matched=0 loaded=3840); scheduler
# affinity spread over all cores; 0/48 arithmetic errors through the router;
# no NoF errors (alignment, TRANSFER_FAIL, CQ, SQ deletion).
chart:
  name: sglang
  version: ">=0.9.27"
# The stock image, like the other 6000D L3 variants. What L3 on NVMe-oF needs
# from it: a Mooncake client with NoF support, and HiCache host pools whose
# page stride is a 512-byte multiple (see mem-layout below). Also check that
# Mooncake's SPDK init leaves the scheduler threads their CPU affinity: clients
# before Mooncake PR #3904 pin all eight to CPU 0 (measured: decode 39 vs 120
# tok/s); look at Cpus_allowed_list of the sglang::scheduler processes.
image:
  repository: lmsysorg/sglang
  tag: v0.5.21
requires:
  # Per-role per-pod GPUs are in values.pd.{prefill,decode}.gpus ("8"); total
  # GPUs are a deploy-time choice (xPyD), so there is no single number here.
  gpus: 1
  topology: pd
  rdma: true
  gpuProduct:
    - NVIDIA-RTX-6000D
  # Not expressible in this block, but required on every PREFILL node (labelled
  # ebof.modelsphere.io/storage-net=true; pd.prefill.affinityReplace pins them):
  #   * ~650 GiB of 2 MiB hugepages reserved AND advertised by kubelet
  #   * routes to the EBOF targets on the storage NICs
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --allowed-media-domains=none.invalid
    - --tp-size=8
    # Required on sm120: the default trtllm runner has no sm120 kernels and
    # flashinfer_cutlass serves but miscomputes.
    - --moe-runner-backend=marlin
    - --mem-fraction-static=0.80
    - --chunked-prefill-size=4096
    - --max-prefill-tokens=4096
    - --trust-remote-code
    - --max-running-requests=256
    - --enable-cache-report
    - '--default-chat-template-kwargs={"thinking": true}'
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    # Mooncake cannot register expandable-segment memory for RDMA.
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:False
    - name: NCCL_SOCKET_IFNAME
      value: bond0
    - name: GLOO_SOCKET_IFNAME
      value: bond0
    - name: NCCL_NET_GDR_LEVEL
      value: "1"
  shm:
    enabled: true
    sizeLimit: 64Gi
  service:
    port: 8050
  hangWatcher:
    enabled: true
  hostNetwork: true
  rdma:
    enabled: true
  scaler:
    enabled: false
  # SPDK needs these three, and NOT privileged: a privileged container receives
  # every device on the host, which defeats the GPU device plugin.
  securityContext:
    capabilities:
      add: ["SYS_ADMIN", "IPC_LOCK", "SYS_RESOURCE"]
  volumes:
    - name: engine-cache
      hostPath:
        path: /data/cache/deepseek-v4-flash-0731-nvfp4/sglang
        type: DirectoryOrCreate
  volumeMounts:
    - name: engine-cache
      mountPath: /root/.cache
  # The chart's default startupProbe kills a PD engine inside sglang's PD
  # warmup, which looks exactly like a hang.
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  progressDeadlineSeconds: 7200
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: ebof-test, operator: Exists, effect: NoSchedule }
    - { key: dedicated, operator: Exists, effect: NoSchedule }
  pd:
    enabled: true
    colocate: false
    prefill:
      gpus: "8"
      replicas: 2
      size: 1
      env:
        # With P2PHANDSHAKE peers dial this; unset they dial "localhost".
        - name: MOONCAKE_LOCAL_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Per process, per worker. At the 4 MiB default, eight ranks reading
        # one long prefix back at once tore NoF qpairs down (CQ transport error
        # -6 -> SQ DELETION) and most of the prefix missed; at 1 MiB it hit
        # 100%. Measured 2026-11-03.
        - name: MC_NOF_INFLIGHT_BYTES_LIMIT
          value: "1048576"
        # Required for hugepage-backed pools >= 4 GiB: without it registration
        # dies with "Failed to register memory ...: Invalid argument" -> -600.
        - name: RDMAV_HUGEPAGES_SAFE
          value: "1"
      # Only prefill does L3, so only prefill needs a node on the EBOF storage
      # network; decode is left to float to any GPU node.
      affinityReplace:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: ebof.modelsphere.io/storage-net
                    operator: In
                    values: ["true"]
    decode:
      gpus: "8"
      replicas: 1
      size: 1
      # Soft, not required: keep decode OFF the storage-network nodes when any
      # other GPU node has room, because only prefill can use them and there are
      # few. Left floating, the first install put decode on one of the two free
      # storage nodes and the second prefill sat Pending.
      affinityReplace:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ebof.modelsphere.io/storage-net
                    operator: NotIn
                    values: ["true"]
  # The chart puts this on the prefill role only: a PD decode engine receives
  # KV over the transfer engine instead of matching prefixes.
  storageKVOffload:
    enabled: true
    backend: hicache
    storage_backend: mooncake
    hicache:
      # A ratio, not size: DeepSeek V4 HiCache refuses an absolute size ("use
      # --hicache-ratio instead"). At 2 the host pools come to 85 GB per rank.
      ratio: 2
      # Required for L3 on NVMe-oF, not tuning. NoF moves whole 512-byte
      # blocks; with the default page_first layout the per-page objects of four
      # pools are 786240 / 177408 / 34560 / 6439680 bytes, the client rejects
      # every one ("not aligned to block size 512"), and nothing but the two
      # state pools reaches L3. page_first_direct pads each page to a 512-byte
      # stride, and its transfer path exists only with the direct IO backend.
      mem-layout: page_first_direct
      io-backend: direct
      # timeout, not wait_complete: wait_complete waits with no upper bound and
      # sglang's PD warmup goes through the same path. The default budget is
      # far too small for a cold read off the array.
      storage-prefetch-policy: timeout
      # replica_num 0 / nof_replica_num 1 = pure NoF: no DRAM replica.
      storage-backend-extra-config: '{"replica_num": 0, "nof_replica_num": 1, "prefetch_timeout_base": 10, "prefetch_timeout_per_ki_token": 2.0}'
    mooncake:
      # Standalone, outside Kubernetes, owning NoF volumes no other master
      # holds. SITE-SPECIFIC: replace the placeholder host with yours.
      master: "mooncake-master.example:50051"
      te_meta_data_server: "http://mooncake-master.example:8080/metadata"
      protocol: "rdma"
      # The storage NICs; left to auto-detect Mooncake has picked the
      # management NIC on this cluster.
      device: "mlx5_3,mlx5_4"
      # Must NOT be 0: the startup warmup put still needs a DRAM segment.
      global_segment_size: "1gb"
      use_hugepage: true
      hugepage:
        page_size: "2MB"
        # Per prefill pod: 8 x (85 GB of host pools + 1 GiB segment) ~= 644 GiB
        # (measured 636 GiB in use); the nodes advertise 660 GiB.
        resource_limit: "650Gi"
  localKVOffload:
    enabled: false
