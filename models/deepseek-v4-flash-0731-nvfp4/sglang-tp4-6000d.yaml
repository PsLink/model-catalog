apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash-0731-nvfp4
id: sglang-tp4-6000d
version: 1.0.3
servedName: deepseek-v4-flash-0731-nvfp4
engine: sglang
description: >-
  NVIDIA's NVFP4 build with TP4 on four RTX 6000D GPUs. Measured: ready in ~6.5 min, 40.94 GB of weights per card, KV ~3.6M tokens. Two fit one node. --moe-runner-backend=marlin is required: the default trtllm backend has no sm120 kernels, and flashinfer_cutlass serves but silently miscomputes (identical temperature-0 requests answer 23*47 as 161, 1721, 1551); marlin was correct and stable. /root/.cache is a hostPath so compiled kernels survive a restart.
chart:
  name: sglang
  version: ">=0.9.14"
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 4
  topology: single-node
  gpuProduct:
    - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=4
    - --mem-fraction-static=0.85
    - --moe-runner-backend=marlin
    - --trust-remote-code
    - --max-running-requests=256
    - --enable-cache-report
    - '--default-chat-template-kwargs={"thinking": true}'
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
  volumes:
    - name: engine-cache
      hostPath:
        path: /data/cache/deepseek-v4-flash-0731-nvfp4/sglang
        type: DirectoryOrCreate
  volumeMounts:
    - name: engine-cache
      mountPath: /root/.cache
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  hangWatcher:
    enabled: true
