apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3
id: sglang-tp8-b300-optimized-78ce616b0c5b
version: 1.0.0
servedName: Kimi-K3
description: 'Tuned by LLM AutoTune: TP8 on eight B300 GPUs, single node, fp8 KV cache,
  DSPARK speculative decoding, hierarchical KV cache. Normalized throughput within
  the SLO vs the baseline variant: +62.8% (50k + 1.5k), +11.2% (8k + 1k).'
engine: sglang
chart:
  name: sglang
  version: '>=0.8.0'
image:
  repository: harbor.4pd.io/hardcore-tech/sglang
  tag: v0.5.22
  digest: sha256:5fc09edb6a0bb1d5b6992b543723c66d08f86d7a507e951e87e0d05db4ac766e
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  model:
    mountPath: /model
    contextLength: ''
  extraArgs:
  - --chunked-prefill-size=16384
  - --dcp-size=8
  - --enable-cache-report
  - --enable-hierarchical-cache
  - --enable-linear-replayssm-spec
  - --hicache-size=150
  - --kv-cache-dtype=fp8_e4m3
  - --mamba-full-memory-ratio=2
  - --max-running-requests=51
  - --mem-fraction-static=0.85
  - --reasoning-parser=kimi_k3
  - --speculative-algorithm=DSPARK
  - --speculative-draft-model-path=/draft-model
  - --speculative-dspark-block-size=4
  - --stream-response-default-include-usage
  - --tokenizer-worker-num=4
  - --tool-call-parser=kimi_k3
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: TORCHINDUCTOR_COMPILE_THREADS
    value: '8'
  volumes:
  - name: extra-0
    hostPath:
      path: /mnt/disk0/models/Kimi-K3-DSpark
  volumeMounts:
  - name: extra-0
    mountPath: /draft-model
