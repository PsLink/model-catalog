# Settings for the catalog as a whole. What belongs to one model lives in
# models/<name>/metadata.yaml.
apiVersion: catalog.swiss/v1

# Where the catalog is served: the catalog-server's publicUrl. index-v2.json
# names it as its site, and its raw/ as where old revisions are fetched.
site: {{site}}

# The catalog's repository, for links to its commits and files.
repo: {{repo}}
