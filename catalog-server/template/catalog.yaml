# Settings for the catalog as a whole. What belongs to one model lives in
# models/<name>/metadata.yaml.
apiVersion: catalog.swiss/v1

# Where the catalog is served. index-v2.json names it as its site; the
# catalog decides it, whatever routes to its server.
site: {{site}}

# Where old revisions are fetched, at <raw><commit>/<path>: the server's raw/.
raw: {{raw}}

# The catalog's repository, for links to its commits and files.
repo: {{repo}}
