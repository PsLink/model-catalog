<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Model Catalog</title>
<!-- ModelSphere's mark, as on its GitHub organization. -->
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<!-- The stored theme and the chosen view (URL first, then storage), applied
     before first paint. -->
<script>
  try {
    var d = document.documentElement, t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") d.dataset.theme = t;
    var v = new URLSearchParams(location.search).get("view") || localStorage.getItem("view");
    if (v === "cards") d.dataset.view = v;
  } catch (e) {}
</script>
<!-- What every route renders from: fetched alongside the scripts. -->
<link rel="preload" href="%BASE_URL%index-v2.json" as="fetch" crossorigin>
</head>
<body>
<div id="root"></div>
<noscript><p>This catalog needs JavaScript to show. The catalog itself is <a href="%BASE_URL%index.json">index.json</a>.</p></noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
