name: lints

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate model schemas
        run: npm run validate:schema -- --base ${{ github.event.pull_request.base.sha }}

      - name: Detect implementation changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const implementation = files.some(file => !file.startsWith('models/') && file !== 'catalog.yaml');
          appendFileSync(process.env.GITHUB_OUTPUT, `implementation=${implementation}\n`);
          NODE

      # Includes AutoTune validator self-tests. Model-only PRs use the schema,
      # Helm, image and original-track checks instead of development fixtures.
      - name: Test
        if: steps.changes.outputs.implementation == 'true'
        run: npm test

      - name: Install pinned Helm, kubeconform and crane
        run: npm run tools:install

      - name: Validate every model variant against latest stable charts
        run: npm run validate:helm

      # A catalog is public, so every image must be pullable by anyone. The
      # runner is the outside world: no login, no VPN. A pull request also
      # holds each pinned digest to what its tag resolves to now.
      - name: Check every image is publicly pullable
        run: npm run validate:images -- --match-digest
