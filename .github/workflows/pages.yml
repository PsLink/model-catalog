name: pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_rewrites:
        description: Publish published versions edited in place (a deliberate rewrite)
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR builds are cancelled; master builds queue rather than cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Helm, kubeconform and crane
        run: npm run tools:install

      - name: validate
        run: npm run validate

      - name: Build Pages site and catalog
        run: npm run build:site
        env:
          REWRITES: ${{ github.event_name == 'pull_request' && 'warn' || (inputs.allow_rewrites && 'allow' || 'refuse') }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one mid-flight.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
